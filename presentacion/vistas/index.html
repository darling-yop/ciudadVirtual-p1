<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Ciudad</title>
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="nombre-ciudad">Cargando...</h1>
            <div class="info-general">
                <span id="turno">Turno: 0</span>
                <span id="puntuacion">Puntuación: 0</span>
            </div>
        </header>

        <main>
            <section class="panel-principal">
                <div class="estadisticas">
                    <h2>Estadísticas de la Ciudad</h2>
                    <div id="estadisticas-contenido">
                        <!-- Se llenará dinámicamente -->
                    </div>
                </div>

                <div class="clima">
                    <h2>Clima Actual</h2>
                    <div id="clima-contenido">
                        <p>Cargando datos climáticos...</p>
                    </div>
                </div>
            </section>

            <section class="mapa">
                <h2>Mapa de la Ciudad</h2>
                <div class="mapa-controles">
                    <label for="selector-tipo">Tipo de construcción:</label>
                    <select id="selector-tipo">
                        <option value="r">Vía (r)</option>
                        <option value="R1">Residencial R1</option>
                        <option value="R2">Residencial R2</option>
                        <option value="C1">Comercial C1</option>
                        <option value="C2">Comercial C2</option>
                        <option value="I1">Industrial I1</option>
                        <option value="I2">Industrial I2</option>
                        <option value="S1">Servicios S1</option>
                        <option value="S2">Servicios S2</option>
                        <option value="S3">Servicios S3</option>
                        <option value="U1">Utilidad U1</option>
                        <option value="U2">Utilidad U2</option>
                        <option value="P1">Parque P1</option>
                    </select>
                    <button id="boton-construir">Construir</button>
                    <button id="boton-demoler">Demoler</button>
                </div>
                <div id="info-celda">Seleccione una celda para interactuar</div>
                <div id="mapa-grid" class="mapa-grid"></div>
            </section>

            <section class="noticias">
                <h2>Noticias Regionales</h2>
                <div id="noticias-contenido">
                    <p>Cargando noticias...</p>
                </div>
            </section>

            <section class="controles">
                <button id="procesar-turno">Procesar Turno</button>
                <button id="iniciar-servicios">Iniciar Servicios Externos</button>
                <button id="boton-iniciar-turnos">Iniciar Turnos Automáticos</button>
                <button id="boton-detener-turnos" disabled>Detener Turnos</button>
                <button id="boton-exportar">Exportar JSON</button>
            </section>
        </main>
    </div>

    <script type="module" src="../negocio/app.js"></script>
</body>
</html>
