<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración Inicial - Ciudad Virtual</title>
    <link rel="stylesheet" href="../estilos/setup.css" />
</head>
<body>
    <main class="setup-container">
        <section class="setup-card">
            <h1>Creación de Nueva Ciudad (HU-001)</h1>
            <form id="setup-form">
                <label>
                    Nombre de la ciudad *
                    <input id="nombre-ciudad" type="text" maxlength="50" placeholder="Ej: Springfield" required />
                </label>
                <label>
                    Nombre del alcalde *
                    <input id="nombre-alcalde" type="text" maxlength="50" placeholder="Ej: Homer Simpson" required />
                </label>
                <label>
                    Región geográfica *
                    <select id="region" required>
                        <option value="">Selecciona</option>
                        <option value="Bogotá">Bogotá</option>
                        <option value="Medellín">Medellín</option>
                        <option value="Cali">Cali</option>
                    </select>
                </label>
                <label>
                    Tamaño del mapa *
                    <input id="tamano-mapa" type="number" min="15" max="30" value="20" required />
                </label>

                <div class="helper-text" id="error-msg" aria-live="polite"></div>

                <button type="submit">Crear ciudad y continuar</button>
            </form>
        </section>
    </main>

    <script src="index-redirect.js"></script>

</body>
</html>
